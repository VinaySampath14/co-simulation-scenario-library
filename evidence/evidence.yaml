assertions:
  - id: EVD-0001
    scenario_id: SCN-0001
    subject: reported_software_components_and_demo_purpose
    source_id: SRC-0001
    locator: "README.md:3–18"
    evidence_status: explicitly_reported
    note: "Introduces the demonstration, lists five components and gives the Python entry point."
    locator_url: https://gitlab.com/mosaik/examples/mosaik-demo/-/blob/74e2e1b8e53a3bfa1cdbba8897c7e8cd5d23b1e8/README.md#L3-18
  - id: EVD-0002
    scenario_id: SCN-0001
    subject: hosted_live_demo
    source_id: SRC-0002
    locator: "Live-demo heading"
    evidence_status: explicitly_reported
    note: "Describes interactive visualization and looping April, August and December 2014 cases with medium, high and low PV active power, respectively. The web search index supplied the page text because direct fetch returned HTTP 401."
  - id: EVD-0003
    scenario_id: SCN-0001
    subject: entry_point_and_run_configuration
    source_id: SRC-0001
    locator: "demo.py:9–44, 145–146; pyproject.toml:1–14"
    evidence_status: verified_from_code
    note: "Defines simulator launch configuration, January 2014 start and 31-day unpaced run with seed 23. The manifest requires Python >=3.12."
    locator_url: https://gitlab.com/mosaik/examples/mosaik-demo/-/blob/74e2e1b8e53a3bfa1cdbba8897c7e8cd5d23b1e8/demo.py#L9-44
  - id: EVD-0004
    scenario_id: SCN-0001
    subject: locked_versions
    source_id: SRC-0001
    locator: "uv.lock:104–232, 337–344"
    evidence_status: verified_from_code
    note: "The lock records dependency versions. Six inspected wheels matched hashes in this file."
    locator_url: https://gitlab.com/mosaik/examples/mosaik-demo/-/blob/74e2e1b8e53a3bfa1cdbba8897c7e8cd5d23b1e8/uv.lock#L104-232
  - id: EVD-0005
    scenario_id: SCN-0001
    subject: physical_component_initialization_and_pv_coupling
    source_id: SRC-0001
    locator: "demo.py:47–62"
    evidence_status: verified_from_code
    note: "Starts PyPower, HouseholdSim and CSV, instantiates their entities and uses seeded random placement to connect PV power."
    locator_url: https://gitlab.com/mosaik/examples/mosaik-demo/-/blob/74e2e1b8e53a3bfa1cdbba8897c7e8cd5d23b1e8/demo.py#L47-62
  - id: EVD-0006
    scenario_id: SCN-0001
    subject: household_placement_and_profile_input
    source_id: SRC-0001
    locator: "demo.py:134–142; data/profiles.data.gz (decompressed lines 1–10)"
    evidence_status: verified_from_code
    note: "The grid node list has 37 IDs. The file metadata declares 60 profiles in W at 15-minute resolution. House node_id is read during setup."
    locator_url: https://gitlab.com/mosaik/examples/mosaik-demo/-/blob/74e2e1b8e53a3bfa1cdbba8897c7e8cd5d23b1e8/demo.py#L134-142
  - id: EVD-0007
    scenario_id: SCN-0001
    subject: output_configuration_and_connections
    source_id: SRC-0001
    locator: "demo.py:64–131"
    evidence_status: verified_from_code
    note: "Records configured output paths, periods, attribute maps and display scales. Branch logging repeats P_from and does not request Q_to."
    locator_url: https://gitlab.com/mosaik/examples/mosaik-demo/-/blob/74e2e1b8e53a3bfa1cdbba8897c7e8cd5d23b1e8/demo.py#L64-131
  - id: EVD-0008
    scenario_id: SCN-0001
    subject: defined_distribution_network
    source_id: SRC-0001
    locator: "data/demo_lv_grid.json:1–86"
    evidence_status: verified_from_code
    note: "10 MVA base and 39 buses (one REF and 38 PQ), one transformer and 37 lines."
    locator_url: https://gitlab.com/mosaik/examples/mosaik-demo/-/blob/74e2e1b8e53a3bfa1cdbba8897c7e8cd5d23b1e8/data/demo_lv_grid.json#L1-86
  - id: EVD-0009
    scenario_id: SCN-0001
    subject: csv_defined_pv_model
    source_id: SRC-0004
    locator: "mosaik_csv.py:28–74, 90–134; demo repository data/pv_10kw.csv:1–5 and data/pv_30kw.csv:1–5"
    evidence_status: verified_from_code
    note: "The first line defines PV, the column defines P in W and timestamps are minute-spaced. All CSV entities read from the same current row. The second bundled profile is unused by the entry point."
    locator_url: https://gitlab.com/mosaik/examples/mosaik-demo/-/blob/74e2e1b8e53a3bfa1cdbba8897c7e8cd5d23b1e8/data/pv_10kw.csv#L1-5
  - id: EVD-0010
    scenario_id: SCN-0001
    subject: grid_interface_and_power_flow
    source_id: SRC-0006
    locator: "mosaik_components/mosaik_pypower/mosaik.py:25–97, 140–245; mosaik_components/mosaik_pypower/model.py:70–96, 177–236"
    evidence_status: verified_from_code
    note: "Grid case conversion, bus and branch attributes, active-power input aggregation and the call to PYPOWER runpf."
  - id: EVD-0011
    scenario_id: SCN-0001
    subject: house_model_definition
    source_id: SRC-0005
    locator: "mosaik_components/household/model.py:11–59, 65–100; mosaik_components/household/mosaik.py:11–34, 53–122"
    evidence_status: verified_from_code
    note: "Creates one House per grid node-list entry, reads time-series active power and advances according to the file resolution."
  - id: EVD-0012
    scenario_id: SCN-0001
    subject: demo_input_selection
    source_id: SRC-0001
    locator: "demo.py:29–36, 47–58; data/pv_10kw.csv:1–5; data/pv_30kw.csv:1–5"
    evidence_status: verified_from_code
    note: "The script selects the 10 kW-named series. The 30 kW-named series is bundled but not selected."
    locator_url: https://gitlab.com/mosaik/examples/mosaik-demo/-/blob/74e2e1b8e53a3bfa1cdbba8897c7e8cd5d23b1e8/demo.py#L29-36
  - id: EVD-0013
    scenario_id: SCN-0001
    subject: historical_reuse_of_demo
    source_id: SRC-0009
    locator: "Section 5.1.1, printed pp. 71–72, Listing 5.1"
    evidence_status: explicitly_reported
    note: "The thesis reports two evaluation scenarios derived from an earlier demo. This does not establish evaluation of the reviewed revision."
    locator_url: https://mosaik.offis.de/downloads/AdaptiveStateEstimationInOdysseus.pdf#page=77
  - id: EVD-0014
    scenario_id: SCN-0001
    subject: framework_defaults_and_random_placement
    source_id: SRC-0003
    locator: "mosaik/scenario.py:105–126, 279–305; mosaik/util.py:64–125, 153–171"
    evidence_status: verified_from_code
    note: "The one-second clock and exclusive run end apply to the demo invocation. Random placement uses the helper's default distribution."
  - id: EVD-0015
    scenario_id: SCN-0001
    subject: web_consumer_interface
    source_id: SRC-0007
    locator: "mosaik_components/web/mosaik.py:10–32, 63–119, 138–158"
    evidence_status: verified_from_code
    note: "Topology is a visualization consumer that obtains the graph of related entities and receives connected attributes."
  - id: EVD-0016
    scenario_id: SCN-0001
    subject: hdf5_consumer_interface
    source_id: SRC-0008
    locator: "mosaik_components/hdf5/__init__.py:12–25, 54–118"
    evidence_status: verified_from_code
    note: "Database accepts connected attributes and writes datasets organized by source entity and attribute."
  - id: EVD-0017
    scenario_id: SCN-0001
    subject: scheduler_coordinates_simulators
    source_id: SRC-0010
    locator: "Scheduling and simulation execution"
    evidence_status: explicitly_reported
    note: "Describes time units, dependency-based stepping, synchronization and routing of connected attributes."
  - id: EVD-0018
    scenario_id: SCN-0002
    subject: benchmark_scope_and_topology
    source_id: SRC-0011
    locator: "pp. 13–14, Setup of co-simulation scenario, Fig. 6"
    evidence_status: explicitly_reported
    note: "One shared simplified urban energy workload with weather, PV, building and power-flow components."
    locator_url: https://link.springer.com/content/pdf/10.1186/s42162-022-00231-6.pdf#page=13
  - id: EVD-0019
    scenario_id: SCN-0002
    subject: weather_input
    source_id: SRC-0011
    locator: "p. 15, The meteo simulator"
    evidence_status: explicitly_reported
    note: "A stateless EPW reader supplies temperature, solar irradiance and humidity to the PV and building simulators."
    locator_url: https://link.springer.com/content/pdf/10.1186/s42162-022-00231-6.pdf#page=15
  - id: EVD-0020
    scenario_id: SCN-0002
    subject: benchmark_pv_model
    source_id: SRC-0011
    locator: "p. 15, The PV simulator"
    evidence_status: explicitly_reported
    note: "The benchmark uses the cited PV energy-estimation service with weather and panel area. The paper describes NOCT without wind input and Mattei with wind input, and identifies generated power as the grid-facing signal."
    locator_url: https://link.springer.com/content/pdf/10.1186/s42162-022-00231-6.pdf#page=15
  - id: EVD-0021
    scenario_id: SCN-0002
    subject: benchmark_building_model
    source_id: SRC-0011
    locator: "p. 15, The building simulator"
    evidence_status: explicitly_reported
    note: "The cited building model uses a resistance-capacitance envelope and tracks indoor temperature. The benchmark sends the current heat-pump power demand to the grid."
    locator_url: https://link.springer.com/content/pdf/10.1186/s42162-022-00231-6.pdf#page=15
  - id: EVD-0022
    scenario_id: SCN-0002
    subject: benchmark_grid_model
    source_id: SRC-0011
    locator: "pp. 15–16, The power grid simulator"
    evidence_status: explicitly_reported
    note: "A grid based on Estebsari et al. uses pandapower for power flow and is described as event-triggered on receipt of both building and PV data."
    locator_url: https://link.springer.com/content/pdf/10.1186/s42162-022-00231-6.pdf#page=15
  - id: EVD-0023
    scenario_id: SCN-0002
    subject: framework_variants_and_scale
    source_id: SRC-0011
    locator: "pp. 16–17, Benchmark configuration, Fig. 7 and Table 1"
    evidence_status: explicitly_reported
    note: "Seven variants use four deployment patterns. PV and building instances scale together. The tested mosaik variants reach 10,000 per scaled component."
    locator_url: https://link.springer.com/content/pdf/10.1186/s42162-022-00231-6.pdf#page=16
  - id: EVD-0024
    scenario_id: SCN-0002
    subject: run_period_resolution_and_environment
    source_id: SRC-0011
    locator: "p. 17, Experimental results and Table 2"
    evidence_status: explicitly_reported
    note: "Seven winter days on OpenStack VMs. Weather and PV use 15-minute resolution, while building and grid use one hour."
    locator_url: https://link.springer.com/content/pdf/10.1186/s42162-022-00231-6.pdf#page=17
  - id: EVD-0025
    scenario_id: SCN-0002
    subject: performance_metrics
    source_id: SRC-0011
    locator: "pp. 12–13, Benchmark key performance index, Fig. 5 and Eq. 1"
    evidence_status: explicitly_reported
    note: "Measures setup time, the maximum across simulators of mean step durations, and end-to-end execution time."
    locator_url: https://link.springer.com/content/pdf/10.1186/s42162-022-00231-6.pdf#page=12
  - id: EVD-0026
    scenario_id: SCN-0002
    subject: reported_results_and_scope
    source_id: SRC-0011
    locator: "pp. 17–21 and 23–24, Figs. 8–11 and Conclusion"
    evidence_status: explicitly_reported
    note: "Multiprocess HELICS performs best at the largest tested scale. HELICS and AIOMAS reach one million in the study. Timings depend on the workload."
    locator_url: https://link.springer.com/content/pdf/10.1186/s42162-022-00231-6.pdf#page=23
  - id: EVD-0027
    scenario_id: SCN-0002
    subject: artifact_availability_statement
    source_id: SRC-0011
    locator: "p. 24, Availability of data and materials"
    evidence_status: explicitly_reported
    note: "The publication marks its availability statement as inapplicable and supplies no benchmark artifact link there."
    locator_url: https://link.springer.com/content/pdf/10.1186/s42162-022-00231-6.pdf#page=24
  - id: EVD-0028
    scenario_id: SCN-0002
    subject: pv_estimation_definition
    source_id: SRC-0012
    locator: "Section III, distributed software infrastructure to estimate PV energy production"
    evidence_status: explicitly_reported
    note: "Describes the PV energy-estimation service cited by the benchmark."
  - id: EVD-0029
    scenario_id: SCN-0002
    subject: building_thermal_definition
    source_id: SRC-0013
    locator: "Section II, framework description and Building Agent"
    evidence_status: explicitly_reported
    note: "Describes the thermal-demand component underlying the cited building model."
  - id: EVD-0030
    scenario_id: SCN-0002
    subject: distribution_grid_model_basis
    source_id: SRC-0014
    locator: "Case-study network and power-flow description"
    evidence_status: explicitly_reported
    note: "Documents the distribution-network modeling basis cited by the benchmark. The exact benchmark feeder configuration remains unresolved."
  - id: EVD-0031
    scenario_id: SCN-0003
    subject: research_objective_and_publication
    source_id: SRC-0015
    locator: "Abstract and §1, p. 1"
    evidence_status: explicitly_reported
    note: "Describes the shared simulation and laboratory testbed and three validation use cases."
  - id: EVD-0032
    scenario_id: SCN-0003
    subject: pure_mosaik_coupling
    source_id: SRC-0015
    locator: "§2.1 and Fig. 1, p. 2"
    evidence_status: explicitly_reported
    note: "Central time-stepped coordination. Household VEDs send active and reactive power to pandapower. The laboratory can substitute for the power-flow simulation."
  - id: EVD-0033
    scenario_id: SCN-0003
    subject: virtual_edge_device_definition
    source_id: SRC-0015
    locator: "§2.2 and Fig. 1, p. 2"
    evidence_status: explicitly_reported
    note: "Interfaces update the shared key-value store before logic runs and then deliver setpoints. A battery interface example considers efficiency and state of charge."
  - id: EVD-0034
    scenario_id: SCN-0003
    subject: deployment_and_network_emulation
    source_id: SRC-0015
    locator: "§§3.2–3.3 and Table 1, p. 3"
    evidence_status: explicitly_reported
    note: "Reports Containernet as an available component and describes four deployment stages, including Docker as stage 2."
  - id: EVD-0035
    scenario_id: SCN-0003
    subject: laboratory_topology_profiles_and_equipment
    source_id: SRC-0015
    locator: "§4.1, p. 4 and Fig. 3, p. 3"
    evidence_status: explicitly_reported
    note: "Describes two feeders, a 630 kVA transformer, four household emulations, the optional household 2 battery and 15-minute profiles."
  - id: EVD-0036
    scenario_id: SCN-0003
    subject: baseline_and_controller_variants
    source_id: SRC-0015
    locator: "§4.2, p. 4"
    evidence_status: explicitly_reported
    note: "Describes baseline, direct and forecast battery dispatch, and a transformer controller that signals households 1 and 2 to enter restricted mode."
  - id: EVD-0037
    scenario_id: SCN-0003
    subject: laboratory_timing_and_battery_outcomes
    source_id: SRC-0015
    locator: "§5 and Fig. 4, p. 4"
    evidence_status: explicitly_reported
    note: "Reports four setpoints per minute, 60× acceleration and reduced grid exchange under both battery strategies."
  - id: EVD-0038
    scenario_id: SCN-0003
    subject: congestion_threshold_and_outcomes
    source_id: SRC-0015
    locator: "§5, p. 4 and Fig. 5, p. 5"
    evidence_status: explicitly_reported
    note: "Reports a 35 kW threshold and a 58 kW baseline peak. Curtailment reduced transformer peaks but did not always meet the threshold."
  - id: EVD-0039
    scenario_id: SCN-0004
    subject: monitoring_purpose_and_model
    source_id: SRC-0016
    locator: "Abstract and Chapter 3"
    evidence_status: explicitly_reported
