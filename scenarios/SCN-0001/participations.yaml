scenario_id: SCN-0001
participations:
  - id: PART-0001
    reported_component: mosaik-pypower
    model_id: MOD-0001
    software_id: SW-0001
    role: grid_calculation
    identification_status: identified
    simulator:
      alias: PyPower
      launch:
        python: mosaik_components.mosaik_pypower.mosaik:PyPower
    entities:
      - {type: Grid, count: 1}
      - {type: RefBus, count: 1}
      - {type: PQBus, count: 38}
      - {type: Transformer, count: 1}
      - {type: Branch, count: 37}
    configuration: {gridfile: data/demo_lv_grid.json, step_seconds: 900, pos_loads: true, converge_exception: false}
    dependency_software_ids: [SW-0007]
    evidence_ids: [EVD-0005, EVD-0008, EVD-0010]
  - id: PART-0002
    reported_component: mosaik-csv
    model_id: MOD-0002
    software_id: SW-0002
    role: PV_time_series_input
    identification_status: identified
    simulator:
      alias: CSV
      launch:
        python: mosaik_csv:CSV
    entities: [{type: PV, count: 20}]
    configuration:
      datafile: data/pv_10kw.csv
      sample_interval_seconds: 60
      original_profile_source: null
      unused_bundled_alternative: data/pv_30kw.csv
    evidence_ids: [EVD-0005, EVD-0009, EVD-0012]
  - id: PART-0003
    reported_component: mosaik-householdsim
    model_id: MOD-0003
    software_id: SW-0003
    role: household_demand
    identification_status: identified
    simulator:
      alias: HouseholdSim
      launch:
        python: mosaik_components.household:Simulator
    entities: [{type: ResidentialLoads, count: 1}, {type: House, count: 37}]
    configuration:
      profile_file: data/profiles.data.gz
      grid_name: demo_lv_grid
      profile_interval_seconds: 900
      profiles_in_file: 60
      original_profile_source: null
      pos_loads: true
    evidence_ids: [EVD-0005, EVD-0006, EVD-0011]
  - id: PART-0004
    reported_component: mosaik-web
    model_id: null
    software_id: SW-0004
    role: visualization
    identification_status: output_component
    simulator:
      alias: WebVis
      launch:
        cmd: 'mosaik-web -s 0.0.0.0:8000 %(addr)s'
    entities: [{type: Topology, count: 1}]
    configuration:
      step_seconds: 60
      ignore_types: [Topology, ResidentialLoads, Grid, Database]
      displays:
        RefBus: {attribute: P, unit: W, default: 0, min: 0, max: 30000}
        PQBus: {attribute: Vm, unit: V, default: 230, min: 227.7, max: 232.3}
        House: {attribute: P_out, unit: W, default: 0, min: 0, max: 3000}
        PV: {attribute: P, unit: W, default: 0, min: -10000, max: 0}
    evidence_ids: [EVD-0007, EVD-0015]
  - id: PART-0005
    reported_component: mosaik-hdf5
    model_id: null
    software_id: SW-0005
    role: results_storage
    identification_status: output_component
    simulator:
      alias: DB
      launch:
        cmd: 'mosaik-hdf5 %(addr)s'
    entities: [{type: Database, count: 1}]
    configuration: {step_seconds: 60, duration_seconds: 2678400, filename: demo.hdf5}
    evidence_ids: [EVD-0007, EVD-0016]
