name: Scenario validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install -r requirements-validation.txt
      - name: Validate and generate review indexes
        id: validate
        shell: bash
        run: |
          set -o pipefail
          python tools/validate.py --reports --output-dir review-artifacts \
            --github-repo "$GITHUB_REPOSITORY" --github-revision "$(git rev-parse HEAD)" 2>&1 | tee validation.log
      - name: Run automated tests
        id: tests
        if: success() || steps.validate.outcome == 'failure'
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee tests.log
      - name: Job summary
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            echo '## Scenario catalogue checks'
            echo "- Structural validation: $VALIDATION_OUTCOME"
            echo "- Automated tests: $TEST_OUTCOME"
            echo '- Scientific review: run separately and include the reviewed report with the PR.'
            if test -f validation.log; then
              echo '~~~text'
              cat validation.log
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload check logs and indexes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-validation
          if-no-files-found: ignore
          path: |
            validation.log
            tests.log
            review-artifacts/
